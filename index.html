<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Andromeda Idle</title>
  <meta name="description" content="A space idle game. Mine asteroids, harvest gas giants, salvage wrecks, explore the galaxy and build a fleet. Progress continues while you are away.">
  <meta name="theme-color" content="#04060a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Andromeda">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div id="bg-planet" aria-hidden="true"></div>
  <div id="hud-overlay" aria-hidden="true"></div>

  <div id="app" hidden>
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Open navigation" aria-expanded="false"></button>
      <a class="logo" href="#/bridge">ANDROMEDA<span>IDLE</span></a>
      <div class="top-stats">
        <div class="top-stat" title="Credits">
          <small>Credits</small>
          <b><span class="cr">CR</span> <span class="full" data-b="credits">0</span><span class="short" data-b="credits-short">0</span></b>
        </div>
        <a class="top-stat" href="#/cargo" title="Cargo hold slots used">
          <small>Cargo</small>
          <b data-b="cargo">0 / 0</b>
        </a>
        <a class="top-stat cmdr" href="#/commander" id="top-cmdr"></a>
      </div>
    </header>
    <div id="activity"></div>
    <nav id="sidebar" aria-label="Main navigation"></nav>
    <div id="nav-backdrop"></div>
    <main id="content" tabindex="-1"></main>
  </div>

  <div id="intro" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript><p style="color:#ff7a00;padding:2rem;font-family:sans-serif">Andromeda Idle needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
